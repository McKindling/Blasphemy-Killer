name: dockerhub-description

# Keeps the Docker Hub repository overview in step with README.md. Kept out of
# docker.yml so a README edit doesn't drag a full multi-arch image build along.

on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

permissions: {}

jobs:
  description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dhomoney/blasphemy-killer
          readme-filepath: ./README.md
          short-description: "Scan video and audio files for phrases that take the Lord's name in vain and mute them"
