# Dependabot security updates only. Routine version bumps are off
# (open-pull-requests-limit: 0); security-fix PRs are not affected by that limit.
# Fixes for each ecosystem arrive grouped in one PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ['*']
